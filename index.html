<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>xAdmin</title>
<style>
  :root{
    --bg:#0a0a0a; --panel:#141414; --panel2:#1f1f1f; --border:#333;
    --text:#e8e8e8; --muted:#888; --accent:#4a9eff; --good:#2ecc71; --bad:#e74c3c; --star:#f1c40f;
    --white:#ffffff; --black:#000000;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body {
    width: 100%; min-height: 100vh;
    font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial,sans-serif;
    background:var(--bg); color:var(--text);
    -webkit-text-size-adjust: 100%;
  }
  body { display: flex; flex-direction: column; overflow-x: hidden; }

  header {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 10; width: 100%; flex-shrink: 0;
  }
  .header-title { font-size: 16px; font-weight: 600; color: var(--white); }
  .status {
    font-size: 12px; padding: 6px 12px; border-radius: 8px;
    background: var(--panel2); border: 1px solid var(--border);
    display: flex; align-items: center; gap: 6px; font-weight: 600;
  }
  .status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .status.online { background: rgba(46,204,113,0.15); color: var(--good); border-color: var(--good); }
  .status.online::before { background: var(--good); }
  .status.offline { background: rgba(231,76,60,0.15); color: var(--bad); border-color: var(--bad); }
  .status.offline::before { background: var(--bad); }

  .main-container {
    flex: 1; width: 100%; max-width: 800px; margin: 0 auto;
    padding: 16px; display: flex; flex-direction: column; gap: 16px;
  }

  .card {
    background: var(--panel); border-radius: 12px; padding: 18px;
    border: 1px solid var(--border); width: 100%;
  }
  .card h2 {
    font-size: 16px; color: var(--white); margin-bottom: 16px;
    display: flex; align-items: center; gap: 8px;
  }
  .card h2 svg { flex-shrink: 0; color: var(--accent); }

  label { display: block; margin-bottom: 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
  
  .setting-input, select, textarea {
    background: var(--panel2); border: 1px solid var(--border); color: var(--white);
    padding: 10px 12px; border-radius: 8px; width: 100%; font-size: 14px;
    margin-bottom: 12px; outline: none; font-family: inherit;
  }
  .setting-input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  select { cursor: pointer; -webkit-appearance: none; appearance: none; }
  textarea { min-height: 150px; resize: vertical; font-family: monospace; line-height: 1.4; }

  .btn {
    background: var(--white); color: var(--black); border: none;
    padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 14px;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: 0.2s; font-family: inherit;
  }
  .btn:hover { background: #ddd; }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn svg { flex-shrink: 0; }

  .btn-dark { background: var(--panel2); color: var(--white); border: 1px solid var(--border); }
  .btn-dark:hover { background: #2a2a2a; border-color: var(--white); }
  .btn-accent { background: var(--accent); color: var(--white); }
  .btn-accent:hover { background: #3b8edb; }
  .btn-danger { background: var(--bad); color: var(--white); }
  .btn-danger:hover { background: #c0392b; }

  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .row .btn { flex: 1; min-width: 100px; }

  .status-msg {
    font-size: 13px; margin-top: 12px; padding: 10px 12px; border-radius: 8px;
    display: none; align-items: center; gap: 8px; line-height: 1.3;
  }
  .status-msg.ok { background: rgba(46,204,113,0.15); border: 1px solid var(--good); color: var(--good); display: flex; }
  .status-msg.err { background: rgba(231,76,60,0.15); border: 1px solid var(--bad); color: var(--bad); display: flex; }
  .status-msg svg { flex-shrink: 0; }

  .hint { font-size: 12px; color: var(--muted); margin-top: -8px; margin-bottom: 12px; line-height: 1.4; }
  
  .hidden { display: none !important; }

  /* === ХЛЕБНЫЕ КРОШКИ === */
  .tree-box { display: flex; flex-direction: column; gap: 8px; }
  
  .breadcrumbs {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    margin-bottom: 8px;
    color: var(--muted);
    line-height: 1.5;
  }
  .breadcrumbs span.crumb {
    cursor: pointer;
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
  }
  .breadcrumbs span.crumb:hover { color: #7ab8ff; }
  .breadcrumbs span.sep { color: var(--border); }

  .nav-row {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    transition: 0.2s;
  }
  .nav-row:hover { border-color: var(--accent); }
  
  .nav-row-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
    cursor: pointer;
    padding: 4px 0;
  }
  .nav-row-title svg { color: var(--accent); flex-shrink: 0; }
  
  .nav-row-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .nav-row-actions .btn { padding: 6px 10px; font-size: 12px; min-width: 0; flex: 0 0 auto; }

  .nav-arrow {
    width: 8px; height: 8px;
    border-right: 2px solid var(--muted);
    border-bottom: 2px solid var(--muted);
    transform: rotate(-45deg);
    margin-left: 8px;
    flex-shrink: 0;
  }

  .test-item {
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    padding: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
    font-size: 13px;
  }
  .test-item .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .test-item-info { display: flex; flex-direction: column; overflow: hidden; }
  .test-item-title { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .test-item-title svg { color: var(--muted); flex-shrink: 0; }

  /* Модальные окна (кастомные) */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.7);
    z-index: 50; display: none; align-items: center; justify-content: center;
    padding: 20px; opacity: 0; transition: opacity 0.2s;
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  .modal-overlay.show { display: flex; opacity: 1; }
  .modal {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 22px 20px; width: 100%; max-width: 500px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    transform: scale(0.92); transition: transform 0.2s;
    max-height: 90vh; display: flex; flex-direction: column;
  }
  .modal-overlay.show .modal { transform: scale(1); }
  .modal-title {
    font-size: 17px; font-weight: 700; color: var(--white);
    margin-bottom: 16px; line-height: 1.3; flex-shrink: 0;
  }
  .modal-body { overflow-y: auto; flex: 1; margin-bottom: 16px; }
  .modal-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .modal-actions .btn { flex: 1; padding: 11px 14px; }

  /* Спиннер загрузки */
  .loading-overlay {
    position: fixed; inset: 0; background: rgba(10, 10, 10, 0.85);
    z-index: 100; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px; opacity: 0; transition: opacity 0.2s;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  }
  .loading-overlay.show { display: flex; opacity: 1; }
  .spinner {
    width: 40px; height: 40px;
    border: 4px solid var(--panel2);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }
  .loading-text { color: var(--white); font-weight: 600; font-size: 14px; }
</style>
</head>
<body>

<header>
  <div class="header-title">xAdmin</div>
  <div class="status offline" id="connStatus">Не подключено</div>
</header>

<div class="main-container">

  <div class="card" id="settingsCard">
    <h2>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      Подключение
    </h2>

    </h2>
    <input type="text" class="setting-input" id="siteTitleInput" placeholder="Например: Мои тесты">

    <div class="row">

  <div class="card hidden" id="listCard">

      Содержимое базы

    <div class="tree-box" id="treeBox"></div>
    <div class="row" style="margin-top: 16px;">

</div>

<div class="modal-overlay" id="uiModal">
  <div class="modal" id="uiModalBox">
    <div class="modal-title" id="uiModalTitle"></div>
    <div class="modal-body" id="uiModalBody"></div>
    <div class="modal-actions" id="uiModalActions"></div>
  </div>
</div>

<!-- Оверлей загрузки -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">Сохранение в GitHub...</div>
</div>

<script>
/* ============================================================
   КОНФИГ
   ============================================================ */
const STORAGE_KEY = 'gh_test_admin_cfg_v6';
let cfg = { token: '', repo: '' };
let DATA = { siteTitle: 'Тесты', universities: [] };
let currentPath = { ui: null, fi: null, ci: null, si: null };

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function uid(prefix) {
  return prefix + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,6);
}

/* ============================================================
   SVG-ИКОНКИ
   ============================================================ */
const ICONS = {
  uni: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"></path><path d="M5 21V7l8-4v18"></path><path d="M19 21V11l-6-4"></path></svg>',
  fac: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>',
  course: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>',
  subj: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>',
  file: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>',
  trash: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>',
  edit: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>',
  download: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>',
  ok: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>',
  err: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>'
};

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
function showMsg(el, text, ok) {
  if (!el) return;
  el.innerHTML = (ok ? ICONS.ok : ICONS.err) + '<span>' + esc(text) + '</span>';
  el.className = 'status-msg ' + (ok ? 'ok' : 'err');
  if (ok) {
    setTimeout(() => {
      el.className = 'status-msg';
      el.innerHTML = '';
    }, 3500);
  }
}

function showLoading(text = 'Сохранение в GitHub...') {
  $('loadingOverlay').querySelector('.loading-text').textContent = text;
  $('loadingOverlay').classList.add('show');
}

function hideLoading() {
  $('loadingOverlay').classList.remove('show');
}

/* ============================================================
   GITHUB API
   ============================================================ */
async function ghFetch(url, opts = {}) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 25000);
  try {
    return await fetch(url, {
      ...opts, signal: ctrl.signal,
      headers: {
        'Authorization': `Bearer ${cfg.token}`,
        'Accept': 'application/vnd.github+json',
        ...(opts.headers || {})
      }
    });
  } finally { clearTimeout(timer); }
}

async function ghGetFile(path) {
  const url = `https://api.github.com/repos/${cfg.repo}/contents/${path}`;
  const res = await ghFetch(url);
  if (res.status === 404) return { content: null, sha: null };
  if (!res.ok) throw new Error(`GET ${path} — ${res.status}`);
  const data = await res.json();
  const bin = atob(data.content.replace(/\n/g, ''));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  return { content: new TextDecoder().decode(bytes), sha: data.sha };
}

async function ghPutFile(path, content, sha, message) {
  const url = `https://api.github.com/repos/${cfg.repo}/contents/${path}`;
  const bytes = new TextEncoder().encode(content);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  const res = await ghFetch(url, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      message: message || `update ${path}`,
      content: btoa(bin),
      sha: sha || undefined
    })
  });
  if (!res.ok) {
    const t = await res.text();
    throw new Error(`PUT ${path} — ${res.status}. ${t.slice(0, 150)}`);
  }
  return res.json();
}

/* ============================================================
   ЗАГРУЗКА/СОХРАНЕНИЕ
   ============================================================ */
async function loadData() {
  const { content } = await ghGetFile('XDataBase.json');
  if (!content) return { siteTitle: 'Тесты', universities: [] };
  const raw = JSON.parse(content);

  if (raw.subjects && !raw.universities) {
    return { siteTitle: raw.siteTitle || 'Тесты', universities: [] }; 
  }

  return {
    siteTitle: raw.siteTitle || 'Тесты',
    universities: Array.isArray(raw.universities) ? raw.universities : []
  };
}

async function saveData() {
  showLoading('Сохранение в GitHub...');
  try {
    const { sha } = await ghGetFile('XDataBase.json');
    await ghPutFile(
      'XDataBase.json',
      JSON.stringify(DATA, null, 2),
      sha,
      'Обновление базы тестов'
    );
  } finally {
    hideLoading();
  }
}

/* ============================================================
   ПАРСЕР RAW (валидация)
   ============================================================ */
function parseRaw(rawText) {
  const blocks = rawText.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  const out = [];
  blocks.forEach(block => {
    const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
    if (!lines.length) return;
    const q = lines[0];
    const opts = [];
    let correct = -1;
    for (let i = 1; i < lines.length; i++) {
      const l = lines[i];
      if (l.startsWith('+')) { correct = opts.length; opts.push(l.slice(1).trim()); }
      else if (l.startsWith('−') || l.startsWith('-')) { opts.push(l.slice(1).trim()); }
    }
    if (q && opts.length) out.push({ q, opts, correct });
  });
  return out;
}

/* ============================================================
   UI: МОДАЛЬНЫЕ ОКНА (КАСТОМНЫЕ, С ЗАДЕРЖКОЙ)
   ============================================================ */
let _modalResolver = null;

function openModal({ title, bodyHTML, buttons }) {
  return new Promise(resolve => {
    const ov = $('uiModal');
    $('uiModalTitle').textContent = title;
    $('uiModalBody').innerHTML = bodyHTML;
    const actionsEl = $('uiModalActions');
    actionsEl.innerHTML = '';

    buttons.forEach(btnInfo => {
      const btn = document.createElement('button');
      btn.className = 'btn ' + (btnInfo.class || 'btn-dark');
      btn.textContent = btnInfo.text;
      if (btnInfo.id) btn.id = btnInfo.id;
      btn.onclick = async () => {
        if (btnInfo.onClick) {
          const result = await btnInfo.onClick();
          if (result !== false) closeModal();
          if (result !== undefined && result !== false) resolve(result);
        } else {
          closeModal();
          // Задержка нужна для мобильных браузеров, чтобы избежать багов с Promise
          setTimeout(() => resolve(btnInfo.value), 50);
        }
      };
      actionsEl.appendChild(btn);
    });

    _modalResolver = resolve;
    ov.classList.add('show');
  });
}

function closeModal(result) {
  const ov = $('uiModal');
  ov.classList.remove('show');
  if (_modalResolver) {
    _modalResolver(result);
    _modalResolver = null;
  }
}

function uiConfirm(title, text, okText = 'Да', danger = false) {
  return openModal({

    bodyHTML: `<div style="font-size:14px; color:var(--muted); line-height:1.4;">${esc(text)}</div>`,
    buttons: [
      { text: 'Отмена', class: 'btn-dark', value: false },

    ]
  });
}

function uiAlert(title, text) {

/* ============================================================
   UI: ДЕРЕВО (ХЛЕБНЫЕ КРОШКИ)
   ============================================================ */
function renderTree() {
  const box = $('treeBox');
  
  if (!DATA.universities.length) {
    box.innerHTML = `<div class="hint" style="text-align:center;">Пока нет ни одного ВУЗа</div>`;
    return;
  }

  let crumbsHTML = '';
  const u = currentPath.ui !== null ? DATA.universities[currentPath.ui] : null;
  const f = u && currentPath.fi !== null ? u.faculties[currentPath.fi] : null;
  const c = f && currentPath.ci !== null ? f.courses[currentPath.ci] : null;
  const s = c && currentPath.si !== null ? c.subjects[currentPath.si] : null;

  crumbsHTML += `<span class="crumb" data-nav="root">Главная</span>`;
  if (u) crumbsHTML += ` <span class="sep">></span> <span class="crumb" data-nav="uni">${esc(u.name)}</span>`;
  if (f) crumbsHTML += ` <span class="sep">></span> <span class="crumb" data-nav="fac">${esc(f.name)}</span>`;
  if (c) crumbsHTML += ` <span class="sep">></span> <span class="crumb" data-nav="course">${esc(c.name)}</span>`;
  if (s) crumbsHTML += ` <span class="sep">></span> <span class="crumb" data-nav="subj">${esc(s.name)}</span>`;

  let contentHTML = '';

  function btnActions(editData, delData, isDanger = false) {
    const editAttrs = Object.entries(editData).map(([k,v]) => `data-edit-${k}="${v}"`).join(' ');
    const delAttrs = Object.entries(delData).map(([k,v]) => `data-del-${k}="${v}"`).join(' ');
    return `
      <div class="nav-row-actions">
        <button class="btn btn-dark" ${editAttrs}>${ICONS.edit}</button>
        <button class="btn ${isDanger ? 'btn-danger' : 'btn-dark'}" ${delAttrs}>${ICONS.trash}</button>
      </div>
    `;
  }

  if (!u) {
    contentHTML = DATA.universities.map((uni, idx) => `
      <div class="nav-row" data-nav="uni" data-idx="${idx}">
        <div class="nav-row-title">
          ${ICONS.uni} ${esc(uni.name)} <div class="nav-arrow"></div>
        </div>
        ${btnActions({ type: 'university', ui: idx }, { type: 'university', ui: idx })}
      </div>
    `).join('');
  } else if (!f) {
    contentHTML = (u.faculties || []).length === 0 
      ? '<div class="hint" style="text-align:center; padding: 10px;">Нет факультетов</div>'
      : u.faculties.map((fac, idx) => `
        <div class="nav-row" data-nav="fac" data-idx="${idx}">
          <div class="nav-row-title">
            ${ICONS.fac} ${esc(fac.name)} <div class="nav-arrow"></div>
          </div>
          ${btnActions({ type: 'faculty', ui: currentPath.ui, fi: idx }, { type: 'faculty', ui: currentPath.ui, fi: idx })}
        </div>
      `).join('');
  } else if (!c) {
    contentHTML = (f.courses || []).length === 0 
      ? '<div class="hint" style="text-align:center; padding: 10px;">Нет курсов</div>'
      : f.courses.map((course, idx) => `
        <div class="nav-row" data-nav="course" data-idx="${idx}">
          <div class="nav-row-title">
            ${ICONS.course} ${esc(course.name)} <div class="nav-arrow"></div>
          </div>
          ${btnActions({ type: 'course', ui: currentPath.ui, fi: currentPath.fi, ci: idx }, { type: 'course', ui: currentPath.ui, fi: currentPath.fi, ci: idx })}
        </div>
      `).join('');
  } else if (!s) {
    contentHTML = (c.subjects || []).length === 0 
      ? '<div class="hint" style="text-align:center; padding: 10px;">Нет предметов</div>'
      : c.subjects.map((subj, idx) => `
        <div class="nav-row" data-nav="subj" data-idx="${idx}">
          <div class="nav-row-title">
            ${ICONS.subj} ${esc(subj.name)} <div class="nav-arrow"></div>
          </div>
          ${btnActions({ type: 'subject', ui: currentPath.ui, fi: currentPath.fi, ci: currentPath.ci, si: idx }, { type: 'subject', ui: currentPath.ui, fi: currentPath.fi, ci: currentPath.ci, si: idx })}
        </div>
      `).join('');
  } else {
    contentHTML = (s.tests || []).length === 0 
      ? '<div class="hint" style="text-align:center; padding: 10px;">Нет тестов</div>'
      : s.tests.map((test, idx) => `
        <div class="test-item">
          <div class="test-item-info">
            <div class="test-item-title">${ICONS.file} ${esc(test.title)}</div>
            <div class="meta">Вопросов: ${parseRaw((Array.isArray(test.raw) ? test.raw : [test.raw || '']).join('\n')).length}</div>
          </div>
          <div class="nav-row-actions">
            <button class="btn btn-dark" data-edit-test="${idx}">${ICONS.edit}</button>
            <button class="btn btn-danger" data-del-test="${idx}">${ICONS.trash}</button>
          </div>
        </div>
      `).join('');
  }

  box.innerHTML = `
    <div class="breadcrumbs">${crumbsHTML}</div>
    ${contentHTML}
  `;

  box.querySelectorAll('.crumb').forEach(el => {
    el.addEventListener('click', () => goBack(el.dataset.nav));
  });

  box.querySelectorAll('.nav-row[data-nav]').forEach(el => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('.nav-row-actions')) return;
      navigate(el.dataset.nav, Number(el.dataset.idx));
    });
  });

  box.querySelectorAll('[data-edit-type]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const t = btn.dataset.editType;
      if (t === 'university') editName('university', Number(btn.dataset.editUi));
      if (t === 'faculty') editName('faculty', Number(btn.dataset.editUi), Number(btn.dataset.editFi));
      if (t === 'course') editName('course', Number(btn.dataset.editUi), Number(btn.dataset.editFi), Number(btn.dataset.editCi));
      if (t === 'subject') editName('subject', Number(btn.dataset.editUi), Number(btn.dataset.editFi), Number(btn.dataset.editCi), Number(btn.dataset.editSi));
    });
  });

  box.querySelectorAll('[data-del-type]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const t = btn.dataset.delType;
      if (t === 'university') deleteUniversity(Number(btn.dataset.delUi));
      if (t === 'faculty') deleteFaculty(Number(btn.dataset.delUi), Number(btn.dataset.delFi));
      if (t === 'course') deleteCourse(Number(btn.dataset.delUi), Number(btn.dataset.delFi), Number(btn.dataset.delCi));
      if (t === 'subject') deleteSubject(Number(btn.dataset.delUi), Number(btn.dataset.delFi), Number(btn.dataset.delCi), Number(btn.dataset.delSi));
    });
  });

  box.querySelectorAll('[data-edit-test]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      editTest(currentPath.ui, currentPath.fi, currentPath.ci, currentPath.si, Number(btn.dataset.editTest));
    });
  });
  box.querySelectorAll('[data-del-test]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteTest(currentPath.ui, currentPath.fi, currentPath.ci, currentPath.si, Number(btn.dataset.delTest));
    });
  });
}

function navigate(level, index) {
  if (level === 'uni') { currentPath.ui = index; currentPath.fi = null; currentPath.ci = null; currentPath.si = null; }
  if (level === 'fac') { currentPath.fi = index; currentPath.ci = null; currentPath.si = null; }
  if (level === 'course') { currentPath.ci = index; currentPath.si = null; }
  if (level === 'subj') { currentPath.si = index; }
  renderTree();
}

function goBack(level) {
  if (level === 'root') { currentPath = { ui: null, fi: null, ci: null, si: null }; }
  if (level === 'uni') { currentPath.fi = null; currentPath.ci = null; currentPath.si = null; }
  if (level === 'fac') { currentPath.ci = null; currentPath.si = null; }
  if (level === 'course') { currentPath.si = null; }
  renderTree();
}

/* ============================================================
   РЕДАКТИРОВАНИЕ ИМЕН
   ============================================================ */
function editName(type, ui, fi, ci, si) {
  let currentName = '';
  let title = '';
  let onSave = null;

  if (type === 'university') {
    currentName = DATA.universities[ui].name;
    title = 'Редактировать ВУЗ';
    onSave = (newName) => { DATA.universities[ui].name = newName; };
  } else if (type === 'faculty') {
    currentName = DATA.universities[ui].faculties[fi].name;
    title = 'Редактировать Факультет';
    onSave = (newName) => { DATA.universities[ui].faculties[fi].name = newName; };
  } else if (type === 'course') {
    currentName = DATA.universities[ui].faculties[fi].courses[ci].name;
    title = 'Редактировать Курс';
    onSave = (newName) => { DATA.universities[ui].faculties[fi].courses[ci].name = newName; };
  } else if (type === 'subject') {
    currentName = DATA.universities[ui].faculties[fi].courses[ci].subjects[si].name;
    title = 'Редактировать Предмет';
    onSave = (newName) => { DATA.universities[ui].faculties[fi].courses[ci].subjects[si].name = newName; };
  }

  openModal({
    title: title,
    bodyHTML: `<input type="text" class="setting-input" id="editNameInput" value="${esc(currentName)}" style="margin-bottom:0;">`,
    buttons: [
      { text: 'Отмена', class: 'btn-dark', value: false },
      {
        text: 'Сохранить', class: 'btn-accent',
        onClick: async () => {
          const newName = $('editNameInput').value.trim();
          if (!newName) { await uiAlert('Ошибка', 'Имя не может быть пустым'); return false; }
          
          const btn = $('uiModalActions').lastChild;
          btn.textContent = 'Сохранение...';
          btn.disabled = true;
          try {
            onSave(newName);
            await saveData();
            renderTree();
            refreshSelects();
            return true; 
          } catch(e) {
            await uiAlert('Ошибка', e.message);
            btn.textContent = 'Сохранить';
            btn.disabled = false;
            return false;
          }
        }
      }
    ]
  });
}

/* ============================================================
   РЕДАКТИРОВАНИЕ ТЕСТА (RAW)
   ============================================================ */
function editTest(ui, fi, ci, si, ti) {
  const test = DATA.universities[ui].faculties[fi].courses[ci].subjects[si].tests[ti];
  
  openModal({
    title: 'Редактировать зачёт',
    bodyHTML: `
      <label>Название</label>
      <input type="text" class="setting-input" id="editTestTitle" value="${esc(test.title)}">
      <label>Вопросы (RAW)</label>
      <textarea id="editTestRaw" style="min-height:250px;">${esc((Array.isArray(test.raw) ? test.raw : [test.raw || '']).join('\n'))}</textarea>
    `,
    buttons: [
      { text: 'Отмена', class: 'btn-dark', value: false },
      {
        text: 'Сохранить', class: 'btn-accent',
        onClick: async () => {
          const newTitle = $('editTestTitle').value.trim();
          const newRaw = $('editTestRaw').value.trim();
          
          if (!newTitle || !newRaw) { await uiAlert('Ошибка', 'Заполните все поля'); return false; }
          const qs = parseRaw(newRaw);
          if (!qs.length) { await uiAlert('Ошибка', 'Не найдено вопросов'); return false; }
          const noCorrect = qs.filter(q => q.correct === -1).length;
          if (noCorrect > 0) { await uiAlert('Ошибка', 'Есть вопросы без правильного ответа (+)'); return false; }

          const btn = $('uiModalActions').lastChild;
          btn.textContent = 'Сохранение...';
          btn.disabled = true;
          try {
            test.title = newTitle;
            test.raw = newRaw.split('\n');
            await saveData();
            renderTree();
            return true;
          } catch(e) {
            await uiAlert('Ошибка', e.message);
            btn.textContent = 'Сохранить';
            btn.disabled = false;
            return false;
          }
        }
      }
    ]
  });
}

$('addFacultyBtn').onclick = async () => {
  const name = $('newFacultyName').value.trim();
  const ui = Number(selUniversity.value);
  if (!name) return uiAlert('Ошибка', 'Введите название Факультета');
  if (isNaN(ui) || !DATA.universities[ui]) return uiAlert('Ошибка', 'Сначала выберите ВУЗ');
  if (!DATA.universities[ui].faculties) DATA.universities[ui].faculties = [];
  if (DATA.universities[ui].faculties.some(f => f.name.toLowerCase() === name.toLowerCase())) return uiAlert('Ошибка', 'Такой факультет уже есть');
  DATA.universities[ui].faculties.push({ name, courses: [] });
  await saveData();
  $('newFacultyName').value = '';
  renderTree();
  refreshSelects();
  selUniversity.value = ui;
  selUniversity.dispatchEvent(new Event('change'));
};

$('addCourseBtn').onclick = async () => {
  const name = $('newCourseName').value.trim();
  const ui = Number(selUniversity.value);
  const fi = Number(selFaculty.value);
  if (!name) return uiAlert('Ошибка', 'Введите название Курса');
  if (isNaN(ui) || isNaN(fi)) return uiAlert('Ошибка', 'Выберите ВУЗ и Факультет');
  const f = DATA.universities[ui].faculties[fi];
  if (!f.courses) f.courses = [];
  if (f.courses.some(c => c.name.toLowerCase() === name.toLowerCase())) return uiAlert('Ошибка', 'Такой курс уже есть');
  f.courses.push({ name, subjects: [] });
  await saveData();
  $('newCourseName').value = '';
  renderTree();
  refreshSelects();
  selUniversity.value = ui; selUniversity.dispatchEvent(new Event('change'));
  selFaculty.value = fi; selFaculty.dispatchEvent(new Event('change'));
};

$('addSubjectBtn').onclick = async () => {
  const name = $('newSubjectName').value.trim();
  const ui = Number(selUniversity.value);
  const fi = Number(selFaculty.value);
  const ci = Number(selCourse.value);
  if (!name) return uiAlert('Ошибка', 'Введите название Предмета');
  if (isNaN(ui) || isNaN(fi) || isNaN(ci)) return uiAlert('Ошибка', 'Выберите ВУЗ, Факультет и Курс');
  const c = DATA.universities[ui].faculties[fi].courses[ci];
  if (!c.subjects) c.subjects = [];
  if (c.subjects.some(s => s.name.toLowerCase() === name.toLowerCase())) return uiAlert('Ошибка', 'Такой предмет уже есть');
  c.subjects.push({ name, tests: [] });
  await saveData();
  $('newSubjectName').value = '';
  renderTree();
  refreshSelects();
  selUniversity.value = ui; selUniversity.dispatchEvent(new Event('change'));
  selFaculty.value = fi; selFaculty.dispatchEvent(new Event('change'));
  selCourse.value = ci; selCourse.dispatchEvent(new Event('change'));
};

$('previewBtn').onclick = () => {
  const msg = $('addMsg');
  try {
    const rawText = $('newTestRaw').value.trim();
    if (!rawText) throw new Error('Текст пуст');
    const qs = parseRaw(rawText);
    if (!qs.length) throw new Error('Не найдено вопросов');
    const noCorrect = qs.filter(q => q.correct === -1).length;
    if (noCorrect > 0) showMsg(msg, `Вопросов: ${qs.length}. Без правильного ответа: ${noCorrect}`, false);
    else showMsg(msg, `Вопросов: ${qs.length}. Все с ответами.`, true);
  } catch(e) {
    showMsg(msg, e.message, false);
  }
};

$('newTestRaw').oninput = () => {
  const rawText = $('newTestRaw').value.trim();
  const msg = $('liveValidationMsg');
  if (!rawText) { msg.className = 'status-msg'; return; }
  const qs = parseRaw(rawText);
  const noCorrect = qs.filter(q => q.correct === -1).length;
  if (noCorrect > 0) {
    msg.innerHTML = ICONS.err + `<span>Найдено вопросов: ${qs.length}. Без ответа: ${noCorrect}</span>`;
    msg.className = 'status-msg err';
  } else if (qs.length > 0) {
    msg.innerHTML = ICONS.ok + `<span>Найдено вопросов: ${qs.length}. Всё ок.</span>`;
    msg.className = 'status-msg ok';
  }
};

$('addTestBtn').onclick = async () => {
  const msg = $('addMsg');
  const title = $('newTestTitle').value.trim();
  const rawText = $('newTestRaw').value.trim();

  const ui = Number(selUniversity.value);
  const fi = Number(selFaculty.value);
  const ci = Number(selCourse.value);
  const si = Number(selSubject.value);

  if (!title) return showMsg(msg, 'Введите название зачёта', false);
  if (!rawText) return showMsg(msg, 'Введите вопросы', false);
  if (isNaN(ui) || isNaN(fi) || isNaN(ci) || isNaN(si)) return showMsg(msg, 'Выберите путь до Предмета', false);

  const qs = parseRaw(rawText);
  if (!qs.length) return showMsg(msg, 'Не удалось распознать ни одного вопроса', false);
  const noCorrect = qs.filter(q => q.correct === -1).length;
  if (noCorrect > 0) return showMsg(msg, 'Ошибка: есть вопросы без правильного ответа (+)', false);

  const subj = DATA.universities[ui].faculties[fi].courses[ci].subjects[si];
  if (!subj.tests) subj.tests = [];
  if (subj.tests.some(t => t.title.toLowerCase() === title.toLowerCase())) return showMsg(msg, 'Зачёт с таким названием уже есть', false);

  const btn = $('addTestBtn');
  btn.textContent = 'Сохранение...';
  btn.disabled = true;

  try {
    subj.tests.push({
      id: uid('test'),
      title,
      raw: rawText.split('\n')
    });
    await saveData();
    renderTree();
    $('newTestTitle').value = '';
    $('newTestRaw').value = '';
    $('liveValidationMsg').className = 'status-msg';
    showMsg(msg, 'Зачёт сохранён в GitHub', true);
  } catch(e) {
    showMsg(msg, e.message, false);
  } finally {
    btn.textContent = 'Сохранить в GitHub';
    btn.disabled = false;
  }
};

$('reloadBtn').onclick = async () => {
  try {
    DATA = await loadData();
    $('siteTitleInput').value = DATA.siteTitle;
    currentPath = { ui: null, fi: null, ci: null, si: null };
    renderTree();
    refreshSelects();
  } catch(e) {
    uiAlert('Ошибка', e.message);
  }
};

/* ============================================================
   СКАЧИВАНИЕ JSON
   ============================================================ */
$('downloadJsonBtn').onclick = () => {
  const jsonStr = JSON.stringify(DATA, null, 2);
  const blob = new Blob([jsonStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `tests_backup_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

/* ============================================================
   ПОДКЛЮЧЕНИЕ
   ============================================================ */
async function connect() {
  const msg = $('settingsMsg');
  if (!cfg.token || !cfg.repo) return showMsg(msg, 'Заполни поля', false);
  $('connStatus').textContent = 'Подключение...';
  showLoading('Загрузка данных...');
  try {
    DATA = await loadData();
    $('connStatus').textContent = 'Онлайн';
    $('connStatus').className = 'status online';
    $('settingsCard').classList.add('hidden');
    ['titleCard','addCard','listCard'].forEach(id => $(id).classList.remove('hidden'));
    $('siteTitleInput').value = DATA.siteTitle;
    refreshSelects();
    renderTree();
  } catch(e) {
    $('connStatus').textContent = 'Ошибка';
    $('connStatus').className = 'status offline';
    showMsg(msg, e.message, false);
  } finally {
    hideLoading();
  }
}

/* ============================================================
   СТАРТ
   ============================================================ */
(function init() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      cfg.token = saved.token || '';
      cfg.repo = saved.repo || '';
    }
  } catch(e) {}
  $('tokenInput').value = cfg.token;
  $('repoInput').value = cfg.repo;
  if (cfg.token && cfg.repo) connect();
})();
</script>
