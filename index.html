<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Иммунология</title>
<style>
  :root{
    --bg:#0a0a0a; --panel:#141414; --panel2:#1f1f1f; --border:#333;
    --text:#e8e8e8; --muted:#888; --accent:#4a9eff; --good:#2ecc71; --bad:#e74c3c; --star:#f1c40f;
    --white:#ffffff; --black:#000000;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body {
    width: 100%; height: 100%; 
    overflow: hidden; 
    font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial,sans-serif;
    background:var(--bg); color:var(--text);
    -webkit-text-size-adjust: 100%;
  }
  body {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex; flex-direction: column;
  }

  /* HEADER */
  header{background:var(--panel);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:10; width: 100%; flex-shrink: 0;}
  .header-title{font-size:16px;font-weight:600;color:var(--white); line-height: 1.2;}
  .header-actions { display: flex; gap: 8px; align-items: center; }
  .header-btn{background:var(--panel2);border:1px solid var(--border);color:var(--white);padding:8px; border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.2s; text-decoration: none;}
  .header-btn:hover{background:#2a2a2a; border-color: var(--white);}
  .header-btn svg { width: 22px; height: 22px; }

  /* LAYOUT */
  .main-container{display:flex;flex:1;width:100%;max-width:900px;margin:0 auto;padding:12px;flex-direction:column;gap:12px; overflow: hidden;}
  
  /* STATS BAR */
  .stats-bar{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;width: 100%; flex-shrink: 0;}
  .stats-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;flex-wrap:wrap;gap:8px}
  .stats-row span{color:var(--muted)}
  .stats-row b{color:var(--white)}
  .stats-row b.good{color:var(--good)}
  .stats-row b.bad{color:var(--bad)}
  .timer-badge{background:var(--white);color:var(--black);padding:6px 10px;border-radius:8px;font-weight:bold;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px; font-size:13px;}
  .timer-badge.warn{background:var(--bad);color:var(--white)}
  .progress-bar-bg{height:4px;background:var(--panel2);border-radius:2px;overflow:hidden}
  .progress-bar-fill{height:100%;background:var(--white);width:0%;transition:0.3s}

  /* NAVIGATION SCROLL */
  .nav-container {
    width: 100%; overflow-x: auto; background: var(--panel); border-radius: 12px;
    border: 1px solid var(--border); padding: 8px; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    flex-shrink: 0;
  }
  .nav-container::-webkit-scrollbar { display: none; }
  .nav-grid{display:flex; gap:4px; width: max-content;}
  .nav-btn{width:32px; height:32px; border-radius:6px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:0.1s; font-size:12px; flex-shrink: 0;}
  .nav-btn:hover{border-color:var(--white)}
  .nav-btn.active{background:var(--white); color:var(--black); border-color:var(--white); transform: scale(1.1);}
  
  .nav-btn.good{background:rgba(46,204,113,0.2); border-color:var(--good); color:var(--good)}
  .nav-btn.bad{background:rgba(231,76,60,0.2); border-color:var(--bad); color:var(--bad)}
  .nav-btn.white-passed{background:rgba(255,255,255,0.15); border-color:var(--white); color:var(--white)}

  /* SWIPE CONTAINER */
  .swipe-container {
    display: flex;
    overflow-x: auto;
    overflow-y: hidden;
    scroll-snap-type: x mandatory;
    scroll-behavior: smooth;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    width: 100%;
    border-radius: 12px;
    flex: 1; 
  }
  .swipe-container::-webkit-scrollbar { display: none; }

  /* QUESTION CARD */
  .card{
    flex: 0 0 100%;
    scroll-snap-align: start;
    background:var(--panel); border-radius:12px; padding:20px; border:1px solid var(--border); 
    position:relative; box-sizing: border-box; margin-bottom: 20px;
    width: 100%;
    overflow-wrap: break-word; 
    word-wrap: break-word;
    height: max-content; 
    max-height: 100%; 
    overflow-y: auto;
  }
  .q-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px; gap: 10px;}
  .q-titles{display: flex; flex-direction: column; gap: 4px; flex:1; min-width:0;}
  .q-num{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:0.5px;text-transform:uppercase}
  .q-orig{font-size:12px; color: var(--accent); font-weight: 600; background: rgba(74, 158, 255, 0.1); padding: 4px 8px; border-radius: 4px; display: inline-block; width: max-content;}
  
  .q-header-actions{display:flex;gap:4px;flex-shrink:0;}
  .star-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center;transition:0.2s; flex-shrink: 0;}
  .star-btn:hover{color:var(--star)}
  .star-btn.active{color:var(--star)}
  .star-btn svg{width:22px;height:22px}
  
  .finish-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;display:flex;align-items:center;justify-content:center;transition:0.2s;}
  .finish-btn:hover{color:var(--bad)}
  .finish-btn svg{width:22px;height:22px}

  .question-timer{display:none;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--border);padding:4px 10px;border-radius:6px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--text);width:max-content;margin-bottom:12px;font-weight:600;}
  .question-timer.warn{background:rgba(231,76,60,0.2);border-color:var(--bad);color:var(--bad)}

  .q-text{font-size:16px;margin-bottom:16px;line-height:1.4;color:var(--white);font-weight:500; overflow-wrap: break-word;}
  
  .opt{
    display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--panel2);color:var(--text);
    border:1px solid var(--border);padding:12px 14px;border-radius:8px;margin-bottom:8px;cursor:pointer;font-size:14px;transition:0.15s;
    overflow-wrap: break-word;
  }
  .opt:hover:not(.disabled){border-color:var(--white)}
  .opt.disabled{cursor:default;opacity:0.9}
  .opt.correct{background:rgba(46,204,113,0.15);border-color:var(--good);color:#b8f5d0}
  .opt.wrong{background:rgba(231,76,60,0.15);border-color:var(--bad);color:#f5c0b8}
  .opt.selected{border-color:var(--accent);background:rgba(74,158,255,0.1)}
  
  .opt-radio{width:18px;height:18px;border:2px solid var(--muted);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0; margin-top: 2px;}
  .opt.correct .opt-radio{border-color:var(--good);background:var(--good)}
  .opt.wrong .opt-radio{border-color:var(--bad);background:var(--bad)}
  .opt-radio::after{content:'';width:6px;height:6px;background:var(--panel);border-radius:50%;display:none}
  .opt.correct .opt-radio::after, .opt.wrong .opt-radio::after{display:block}

  /* ACTION BUTTONS */
  .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .btn{background:var(--white);color:var(--black);border:none;padding:12px 16px;border-radius:8px;font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:0.2s;flex:1;min-width:100px}
  .btn:hover{background:#ddd}
  .btn:disabled{opacity:0.5;cursor:not-allowed}
  .btn-dark{background:var(--panel2);color:var(--white);border:1px solid var(--border)}
  .btn-dark:hover{background:#2a2a2a;border-color:var(--white)}
  
  .btn-active-toggle { background: var(--accent); color: var(--white); border-color: var(--accent); }
  .btn-active-toggle:hover { background: #3b8edb; }

  /* FOOTER */
  footer{text-align:center;color:var(--muted);font-size:12px;padding:10px;flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 6px;}
  footer svg { width: 14px; height: 14px; }

  /* SIDEBAR SETTINGS */
  .sidebar-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:20;display:none;opacity:0;transition:opacity 0.2s}
  .sidebar-overlay.show{display:block;opacity:1}
  .sidebar{position:fixed;top:0;right:-100%;width:100%;max-width:340px;height:100%;background:var(--panel);z-index:21;border-left:1px solid var(--border);padding:16px;overflow-y:auto;transition:right 0.3s;display:flex;flex-direction:column;gap:16px}
  .sidebar.show{right:0}
  .sidebar-header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:12px}
  .sidebar-header h3{margin:0;font-size:16px;color:var(--white)}
  .close-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;display:flex}
  .close-btn:hover{color:var(--white)}
  .close-btn svg{width:22px;height:22px}

  .setting-group{margin-bottom:16px}
  .setting-title{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700;letter-spacing:0.5px;margin-bottom:8px}
  .setting-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;cursor:pointer;font-size:14px}
  .setting-row input[type="checkbox"]{width:18px;height:18px;accent-color:var(--white);cursor:pointer}
  .setting-input{background:var(--panel2);border:1px solid var(--border);color:var(--white);padding:8px 10px;border-radius:6px;width:100%;font-size:14px;margin-bottom:8px;outline:none}
  .setting-input:focus{border-color:var(--white)}
  .setting-hint{font-size:11px;color:var(--muted);line-height:1.3}

  .timer-controls{display:flex;gap:6px}
  .timer-controls .btn{flex:1;padding:8px;font-size:12px}

  /* RESULT */
  .result{text-align:center;padding:24px 16px; flex: 0 0 100%; scroll-snap-align: start; background:var(--panel); border-radius:12px; border:1px solid var(--border); height: max-content;}
  .result .grade{font-size:56px;font-weight:800;color:var(--white);margin:8px 0}
  .result .pct{font-size:18px;color:var(--muted);margin-bottom:20px}
  .result-stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:20px;font-size:14px}
  .result-stats div{background:var(--panel2);padding:10px 14px;border-radius:8px;border:1px solid var(--border)}
  .result-stats b{color:var(--white)}

  /* ===== MODAL ===== */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.7);
    z-index:50; display:none; align-items:center; justify-content:center;
    padding:20px; opacity:0; transition:opacity 0.2s;
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  .modal-overlay.show{ display:flex; opacity:1; }
  .modal{
    background:var(--panel); border:1px solid var(--border);
    border-radius:14px; padding:22px 20px; width:100%; max-width:380px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
    transform:scale(0.92); transition:transform 0.2s;
  }
  .modal-overlay.show .modal{ transform:scale(1); }
  .modal-icon{
    width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 14px; background:rgba(74,158,255,0.15); color:var(--accent);
  }
  .modal-icon.danger{ background:rgba(231,76,60,0.15); color:var(--bad); }
  .modal-icon.warn{ background:rgba(241,196,15,0.15); color:var(--star); }
  .modal-icon svg{ width:24px; height:24px; }
  .modal-title{
    font-size:17px; font-weight:700; color:var(--white);
    text-align:center; margin-bottom:8px; line-height:1.3;
  }
  .modal-text{
    font-size:14px; color:var(--muted); text-align:center;
    line-height:1.45; margin-bottom:20px; overflow-wrap:break-word;
  }
  .modal-actions{ display:flex; gap:8px; }
  .modal-actions .btn{ flex:1; padding:11px 14px; font-size:14px; }
  .btn-danger{ background:var(--bad); color:var(--white); }
  .btn-danger:hover{ background:#c0392b; }
  .btn-accent{ background:var(--accent); color:var(--white); }
  .btn-accent:hover{ background:#3b8edb; }
  @keyframes modalShake{
    0%,100%{ transform:scale(1) translateX(0); }
    25%{ transform:scale(1) translateX(-6px); }
    75%{ transform:scale(1) translateX(6px); }
  }
  .modal.shake{ animation:modalShake 0.3s; }
</style>
</head>

const RAW = `Иммунитет — это

function parse(raw){
  const blocks = raw.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  const out = [];
  blocks.forEach(block => {
    const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
    if (!lines.length) return;
    const q = lines[0];
    const opts = [];
    let correct = -1;
    for (let i = 1; i < lines.length; i++){
      const l = lines[i];
      if (l.startsWith('+')) { correct = opts.length; opts.push(l.slice(1).trim()); }
      else if (l.startsWith('−') || l.startsWith('-')) { opts.push(l.slice(1).trim()); }
    }
    if (q && opts.length && correct >= 0) out.push({ q, opts, correct });
  });
  return out;
}

const QUESTIONS = parse(RAW);
const TOTAL = QUESTIONS.length;
const LS_KEY = 'immuno_test_final_v4';

let state = {
  answers: {},
  favorites: {},
  settings: { 
    answerNow: true, 
    shuffleQ: false, 
    shuffleA: false, 
    testTimerMinutes: 15,
    questionLimit: TOTAL,
    questionTimerSec: 0,
    frozenOrder: null
  },
  session: null
};

let timerInterval = null;
let questionInterval = null;
let questionTimeLeft = 0;
let timeRemaining = 0;

/* ---------- PERSISTENCE ---------- */
function loadState(){
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if (s) {
      state = { ...state, ...s, settings: { ...state.settings, ...s.settings } };
      if (s.session && s.session.order && s.session.order.length) {
        state.session = s.session;
        timeRemaining = s.session.timeRemaining || state.settings.testTimerMinutes * 60;
      } else {
        state.session = null;
      }
    }
  } catch(e){}
}
function saveState(){
  try {
    const toSave = { 
      answers: state.answers, 
      favorites: state.favorites, 
      settings: state.settings,
      session: state.session ? {
        order: state.session.order,
        pos: state.session.pos,
        answers: state.session.answers,
        mode: state.session.mode,
        qShuffledOpts: state.session.qShuffledOpts || {},
        timeRemaining: timeRemaining
      } : null
    };
    localStorage.setItem(LS_KEY, JSON.stringify(toSave));
  } catch(e){}
}
loadState();

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function fmtTime(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}

function updateStats(){
  const answered = Object.keys(state.answers).length;
  let good = 0, bad = 0;
  for (const k in state.answers){
    if (state.answers[k].correct) good++; else bad++;
  }
  document.getElementById('sAns').textContent = answered;
  document.getElementById('sTot').textContent = TOTAL;
  document.getElementById('sGood').textContent = good;
  document.getElementById('sBad').textContent = bad;
  
  const pct = TOTAL ? (answered / TOTAL * 100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  
  if (state.session) renderNavGrid();
}

function renderNavGrid(){
  const grid = document.getElementById('navGrid');
  grid.innerHTML = '';
  if (!state.session) return;
  
  const showAnswerNow = state.settings.answerNow;

  state.session.order.forEach((qIndex, i) => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn';
    if (i === state.session.pos) btn.classList.add('active');
    
    btn.textContent = qIndex + 1;
    
    const ans = state.session.answers[qIndex];
    if (ans !== undefined && ans !== null){
      if (showAnswerNow) {
        if (ans === QUESTIONS[qIndex].correct) btn.classList.add('good');
        else btn.classList.add('bad');
      } else {
        btn.classList.add('white-passed');
      }
    }

    btn.onclick = () => {
      const container = document.getElementById('swipeContainer');
      container.scrollTo({ left: i * container.clientWidth, behavior: 'smooth' });
      state.session.pos = i;
      saveState();
      renderNavGrid();
    };
    grid.appendChild(btn);
  });
}

function renderAllQuestions(){
  const area = document.getElementById('quizArea');
  area.innerHTML = '';
  
  if (!state.session || state.session.pos >= state.session.order.length){
    renderResult();
    return;
  }

  const showAnswerNow = state.settings.answerNow;
  const hasQuestionTimer = state.settings.questionTimerSec > 0;
  
  state.session.order.forEach((qIndex, idx) => {
    const q = QUESTIONS[qIndex];
    const answered = state.session.answers[qIndex] !== undefined && state.session.answers[qIndex] !== null;
    const selected = state.session.answers[qIndex];
    const isLast = idx === state.session.order.length - 1;
    const isActive = idx === state.session.pos;
    
    let opts = q.opts.map((text, i) => ({ text, originalIdx: i }));
    if (state.settings.shuffleA) {
      if (!state.session.qShuffledOpts) state.session.qShuffledOpts = {};
      if (!state.session.qShuffledOpts[qIndex]) state.session.qShuffledOpts[qIndex] = shuffle(opts);
      opts = state.session.qShuffledOpts[qIndex];
    }
    
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="q-header">
        <div class="q-titles">
          <div class="q-num">Вопрос ${idx + 1} из ${state.session.order.length}</div>
          <div class="q-orig">Оригинал: №${qIndex + 1}</div>
        </div>
        <div class="q-header-actions">
          <button class="star-btn ${state.favorites[qIndex]?'active':''}" data-fav="${qIndex}" title="В избранное">
            ${state.favorites[qIndex] ? ICON_STAR_FILLED : ICON_STAR}
          </button>
          <button class="finish-btn" data-finish="1" title="Завершить тест">
            ${ICON_CLOSE}
          </button>
        </div>
      </div>
      ${hasQuestionTimer && isActive ? `<div class="question-timer" id="questionTimer"><span>${state.settings.questionTimerSec} сек</span></div>` : ''}
      <div class="q-text">${escapeHtml(q.q)}</div>
      <div class="opts-list">
        ${opts.map((opt) => {
          let cls = 'opt';
          const isSel = selected === opt.originalIdx;
          const isCorrect = opt.originalIdx === q.correct;
          if (answered && showAnswerNow) {
            cls += ' disabled';
            if (isCorrect) cls += ' correct';
            else if (isSel) cls += ' wrong';
          } else if (isSel) {
            cls += ' selected';
          }
          return `<button class="${cls}" data-q="${qIndex}" data-orig="${opt.originalIdx}" ${answered && showAnswerNow ? 'disabled' : ''}>
            <div class="opt-radio"></div>
            <span>${escapeHtml(opt.text)}</span>
          </button>`;
        }).join('')}
      </div>
      <div class="actions">
        ${!answered && showAnswerNow ? `<button class="btn btn-dark show-ans" data-q="${qIndex}">Показать ответ</button>` : ''}
        <button class="btn next-btn" data-idx="${idx}">
          ${isLast ? 'Завершить' : 'Вперёд ' + ICON_ARROW_RIGHT}
        </button>
      </div>
    `;
    area.appendChild(card);
  });

  area.querySelectorAll('.star-btn').forEach(btn => {
    btn.onclick = () => {
      const qi = Number(btn.dataset.fav);
      if (state.favorites[qi]) delete state.favorites[qi];
      else state.favorites[qi] = true;
      saveState(); updateStats(); renderAllQuestions();
    };
  });

  area.querySelectorAll('.finish-btn').forEach(btn => {
    btn.onclick = async () => {
      const ok = await uiConfirm({
        title: 'Завершить тест?',
        text: 'Текущие ответы сохранятся, но вернуться к вопросам будет нельзя.',
        icon: 'danger',
        okText: 'Завершить',
        cancelText: 'Продолжить',
        danger: true,
      });
      if (ok) renderResult();
    };
  });

  area.querySelectorAll('.opt').forEach(btn => {
    btn.onclick = () => {
      const qi = Number(btn.dataset.q);
      const origIdx = Number(btn.dataset.orig);
      if (state.session.answers[qi] !== undefined && state.settings.answerNow) return;
      
      state.session.answers[qi] = origIdx;
      state.answers[qi] = { selected: origIdx, correct: origIdx === QUESTIONS[qi].correct };
      saveState();
      
      if (state.settings.answerNow) {
        stopQuestionTimer();
        renderAllQuestions();
      } else {
        area.querySelectorAll(`.opt[data-q="${qi}"]`).forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      }
      updateStats();
    };
  });

  area.querySelectorAll('.show-ans').forEach(btn => {
    btn.onclick = () => {
      const qi = Number(btn.dataset.q);
      state.session.answers[qi] = -1;
      state.answers[qi] = { selected: -1, correct: false };
      saveState();
      stopQuestionTimer();
      renderAllQuestions();
    };
  });

  area.querySelectorAll('.next-btn').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.dataset.idx);
      const container = document.getElementById('swipeContainer');
      
      if (idx < state.session.order.length - 1) {
        container.scrollTo({ left: (idx + 1) * container.clientWidth, behavior: 'smooth' });
        state.session.pos = idx + 1;
        saveState();
        renderNavGrid();
      } else {
        renderResult();
      }
    };
  });

  const container = document.getElementById('swipeContainer');
  setTimeout(() => {
    container.scrollTo({ left: state.session.pos * container.clientWidth, behavior: 'instant' });
    startQuestionTimer();
  }, 10);
}

/* ---------- QUESTION TIMER ---------- */
function startQuestionTimer(){
  stopQuestionTimer();
  const el = document.getElementById('questionTimer');
  if (!state.settings.questionTimerSec || !state.session || !el) return;
  
  questionTimeLeft = state.settings.questionTimerSec;
  el.style.display = 'flex';
  updateQuestionTimerUI();
  
  questionInterval = setInterval(() => {
    questionTimeLeft--;
    updateQuestionTimerUI();
    if (questionTimeLeft <= 0) {
      stopQuestionTimer();
      autoFailCurrentQuestion();
    }
  }, 1000);
}

function stopQuestionTimer(){
  clearInterval(questionInterval);
  questionInterval = null;
}

function updateQuestionTimerUI(){
  const el = document.getElementById('questionTimer');
  if (!el) return;
  el.querySelector('span').textContent = Math.max(0, questionTimeLeft) + ' сек';
  el.classList.toggle('warn', questionTimeLeft <= 5);
}

function autoFailCurrentQuestion(){
  if (!state.session) return;
  const qi = state.session.order[state.session.pos];
  if (state.session.answers[qi] !== undefined && state.session.answers[qi] !== null) return;
  
  state.session.answers[qi] = -1;
  state.answers[qi] = { selected: -1, correct: false };
  saveState();
  updateStats();
  
  const container = document.getElementById('swipeContainer');
  const next = state.session.pos + 1;
  if (next < state.session.order.length) {
    container.scrollTo({ left: next * container.clientWidth, behavior: 'smooth' });
    state.session.pos = next;
    saveState();
    renderNavGrid();
    renderAllQuestions();
  } else {
    renderResult();
  }
}

document.getElementById('swipeContainer').addEventListener('scroll', function() {
  if (!state.session) return;
  const container = this;
  clearTimeout(window.scrollTimeout);
  window.scrollTimeout = setTimeout(() => {
    const cardWidth = container.clientWidth;
    const newPos = Math.round(container.scrollLeft / cardWidth);
    if (state.session.pos !== newPos && newPos >= 0 && newPos < state.session.order.length) {
      state.session.pos = newPos;
      saveState();
      renderNavGrid();
      
      const activeBtn = document.querySelector('.nav-btn.active');
      if (activeBtn) {
        activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }
      
      startQuestionTimer();
    }
  }, 100);
});

function renderResult(){
  stopTimer();
  stopQuestionTimer();
  
  let good = 0, bad = 0;
  state.session.order.forEach(qi => {
    const a = state.session.answers[qi];
    if (a !== undefined && a !== null && a !== -1){
      if (a === QUESTIONS[qi].correct) good++;
      else bad++;
    } else if (a === -1) bad++;
  });
  
  const total = state.session.order.length;
  const pct = total ? Math.round(good / total * 100) : 0;
  const grade = pct >= 90 ? '5' : pct >= 75 ? '4' : pct >= 60 ? '3' : '2';
  
  const finishedSession = state.session;
  state.session = null;
  saveState();
  
  const area = document.getElementById('quizArea');
  area.innerHTML = `
    <div class="result">
      <div style="font-size:15px;color:var(--muted)">Тест завершён</div>
      <div class="grade">${grade}</div>
      <div class="pct">${pct}% правильных</div>
      <div class="result-stats">
        <div>Верно: <b>${good}</b></div>
        <div>Неверно: <b>${bad}</b></div>
        <div>Время: <b>${fmtTime(timeRemaining)}</b></div>
      </div>
      <div class="actions" style="justify-content:center">
        <button class="btn" id="resRestart">Пройти заново</button>
        ${bad > 0 ? `<button class="btn btn-dark" id="resErrors">Повторить ошибки</button>` : ''}
      </div>
    </div>
  `;
  
  document.getElementById('resRestart').onclick = () => startSession();
  const errBtn = document.getElementById('resErrors');
  if (errBtn) {
    errBtn.onclick = () => {
      const errs = finishedSession.order.filter(qi => {
        const a = finishedSession.answers[qi];
        return (a === undefined || a === null || a === -1 || a !== QUESTIONS[qi].correct);
      });
      if (errs.length) startSession(errs);
    };
  }
  updateStats();
  renderNavGrid();
}

function startSession(customOrder = null){
  stopTimer();
  stopQuestionTimer();
  
  let order = customOrder;
  if (!order) {
    if (state.settings.shuffleQ) {
      if (!state.settings.frozenOrder || state.settings.frozenOrder.length !== TOTAL) {
        state.settings.frozenOrder = shuffle(QUESTIONS.map((_, i) => i));
      }
      order = state.settings.frozenOrder.slice();
    } else {
      order = QUESTIONS.map((_, i) => i);
    }
    
    const limit = Math.min(state.settings.questionLimit, TOTAL);
    order = order.slice(0, limit);
  }
  
  state.session = {
    order,
    pos: 0,
    answers: {},
    mode: state.settings.answerNow ? 'normal' : 'exam',
    qShuffledOpts: {}
  };
  
  timeRemaining = state.settings.testTimerMinutes * 60;
  document.getElementById('timerText').textContent = fmtTime(timeRemaining);
  document.getElementById('timerDisplay').classList.remove('warn');
  
  saveState();
  startTimer();
  renderAllQuestions();
  updateStats();
}

function startTimer(){
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeRemaining--;
    if (timeRemaining < 0) timeRemaining = 0;
    document.getElementById('timerText').textContent = fmtTime(timeRemaining);
    document.getElementById('timerDisplay').classList.toggle('warn', timeRemaining <= 60);
    if (timeRemaining <= 0) {
      stopTimer();
      renderResult();
    }
  }, 1000);
}
function stopTimer(){ clearInterval(timerInterval); }

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   КАСТОМНЫЕ МОДАЛЬНЫЕ ОКНА (замена confirm/alert)
   ============================================================ */
const ICON_INFO = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`;
const ICON_QUESTION = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>`;
const ICON_WARN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>`;
const ICON_DANGER = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`;

let _modalResolver = null;

function _closeModal(result){
  const ov = document.getElementById('uiModal');
  ov.classList.remove('show');
  if (_modalResolver) {
    const r = _modalResolver;
    _modalResolver = null;
    r(result);
  }
}

/**
 * options = { title, text, icon, okText, cancelText, danger }
 * Возвращает Promise<boolean>
 */
function uiConfirm(opts){
  return new Promise(resolve => {
    const {
      title = 'Подтвердите действие',
      text = '',
      icon = 'question',
      okText = 'OK',
      cancelText = 'Отмена',
      danger = false,
    } = opts || {};

    const ov = document.getElementById('uiModal');
    const iconEl = document.getElementById('uiModalIcon');
    const titleEl = document.getElementById('uiModalTitle');
    const textEl = document.getElementById('uiModalText');
    const actionsEl = document.getElementById('uiModalActions');

    iconEl.className = 'modal-icon';
    if (icon === 'danger') iconEl.classList.add('danger');
    else if (icon === 'warn') iconEl.classList.add('warn');

    iconEl.innerHTML =
      icon === 'danger' ? ICON_DANGER :
      icon === 'warn'   ? ICON_WARN :
      icon === 'info'   ? ICON_INFO : ICON_QUESTION;

    titleEl.textContent = title;
    textEl.textContent = text;
    textEl.style.display = text ? 'block' : 'none';

    actionsEl.innerHTML = '';

    if (cancelText !== null){
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'btn btn-dark';
      cancelBtn.textContent = cancelText;
      cancelBtn.onclick = () => _closeModal(false);
      actionsEl.appendChild(cancelBtn);
    }

    const okBtn = document.createElement('button');
    okBtn.className = 'btn ' + (danger ? 'btn-danger' : 'btn-accent');
    okBtn.textContent = okText;
    okBtn.onclick = () => _closeModal(true);
    actionsEl.appendChild(okBtn);

    _modalResolver = resolve;
    ov.classList.add('show');

    setTimeout(() => okBtn.focus(), 50);
  });
}

function uiAlert(opts){
  return uiConfirm({
    okText: 'OK',
    cancelText: null,
    icon: 'info',
    ...opts
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('uiModal').classList.contains('show')){
    _closeModal(false);
  }
});
document.getElementById('uiModal').addEventListener('click', e => {
  if (e.target.id === 'uiModal') _closeModal(false);
});

/* UI EVENTS */
const overlay = document.getElementById('sidebarOverlay');
const sidebar = document.getElementById('sidebar');
function openSidebar() { overlay.classList.add('show'); sidebar.classList.add('show'); updateSidebarUI(); }
function closeSidebar() { overlay.classList.remove('show'); sidebar.classList.remove('show'); }

document.getElementById('openSettingsBtn').onclick = openSidebar;
document.getElementById('closeSettingsBtn').onclick = closeSidebar;
overlay.onclick = closeSidebar;

const chkAnswerNow = document.getElementById('chkAnswerNow');
const chkShuffleQ = document.getElementById('chkShuffleQ');
const chkShuffleA = document.getElementById('chkShuffleA');
const testTimerInput = document.getElementById('testTimerInput');
const questionTimerInput = document.getElementById('questionTimerInput');
const sideQCount = document.getElementById('sideQCount');
const sideMaxQ = document.getElementById('sideMaxQ');

function updateSidebarUI() {
  chkAnswerNow.checked = state.settings.answerNow;
  chkShuffleQ.checked = state.settings.shuffleQ;
  chkShuffleA.checked = state.settings.shuffleA;
  testTimerInput.value = state.settings.testTimerMinutes;
  questionTimerInput.value = state.settings.questionTimerSec;
  sideQCount.value = state.settings.questionLimit === TOTAL ? '' : state.settings.questionLimit;
  sideMaxQ.textContent = TOTAL;

  document.getElementById('btnToggleShuffleQ').textContent = state.settings.shuffleQ ? 'Отменить перемешивание вопросов' : 'Перемешать вопросы';
  document.getElementById('btnToggleShuffleQ').className = state.settings.shuffleQ ? 'btn btn-active-toggle' : 'btn btn-dark';
  
  document.getElementById('btnToggleShuffleA').textContent = state.settings.shuffleA ? 'Отменить перемешивание ответов' : 'Перемешать варианты';
  document.getElementById('btnToggleShuffleA').className = state.settings.shuffleA ? 'btn btn-active-toggle' : 'btn btn-dark';

  document.querySelectorAll('[data-limit]').forEach(btn => {
    btn.classList.remove('btn-active-toggle');
    btn.classList.add('btn-dark');
  });
  if (state.settings.questionLimit === TOTAL) {
    const allBtn = document.querySelector('[data-limit="all"]');
    if (allBtn) { allBtn.classList.remove('btn-dark'); allBtn.classList.add('btn-active-toggle'); }
  } else {
    const match = document.querySelector(`[data-limit="${state.settings.questionLimit}"]`);
    if (match) {
      match.classList.remove('btn-dark');
      match.classList.add('btn-active-toggle');
    }
  }
}

chkAnswerNow.onchange = (e) => { state.settings.answerNow = e.target.checked; saveState(); renderNavGrid(); };
chkShuffleQ.onchange = (e) => { 
  state.settings.shuffleQ = e.target.checked; 
  if (!state.settings.shuffleQ) state.settings.frozenOrder = null;
  saveState(); updateSidebarUI(); 
};
chkShuffleA.onchange = (e) => { state.settings.shuffleA = e.target.checked; saveState(); updateSidebarUI(); };
testTimerInput.onchange = (e) => { state.settings.testTimerMinutes = Number(e.target.value) || 15; saveState(); };
questionTimerInput.onchange = (e) => { 
  state.settings.questionTimerSec = Math.max(0, Number(e.target.value) || 0); 
  saveState(); 
};

sideQCount.onchange = (e) => {
  let val = Number(e.target.value);
  if (!val || val < 1) val = TOTAL;
  if (val > TOTAL) val = TOTAL;
  state.settings.questionLimit = val;
  e.target.value = val === TOTAL ? '' : val;
  saveState();
  updateSidebarUI();
};

document.querySelectorAll('[data-limit]').forEach(btn => {
  btn.onclick = () => {
    const val = btn.dataset.limit;
    if (val === 'all') state.settings.questionLimit = TOTAL;
    else state.settings.questionLimit = Number(val);
    saveState();
    updateSidebarUI();
  };
});

document.getElementById('btnStartTimer').onclick = () => { timeRemaining = state.settings.testTimerMinutes * 60; startTimer(); closeSidebar(); };
document.getElementById('btnStopTimer').onclick = stopTimer;
document.getElementById('btnResetTimer').onclick = () => {
  stopTimer();
  timeRemaining = state.settings.testTimerMinutes * 60;
  document.getElementById('timerText').textContent = fmtTime(timeRemaining);
  document.getElementById('timerDisplay').classList.remove('warn');
};

document.getElementById('btnRestart').onclick = async () => {
  const ok = await uiConfirm({
    title: 'Начать тест заново?',
    text: 'Текущий прогресс будет сброшен. Продолжить?',
    icon: 'warn',
    okText: 'Начать заново',
    cancelText: 'Отмена',
  });
  if (ok) {
    startSession();
    closeSidebar();
  }
};

document.getElementById('btnToggleShuffleQ').onclick = () => {
  state.settings.shuffleQ = !state.settings.shuffleQ;
  if (!state.settings.shuffleQ) state.settings.frozenOrder = null;
  saveState();
  updateSidebarUI();
  startSession(); 
};

document.getElementById('btnToggleShuffleA').onclick = () => {
  state.settings.shuffleA = !state.settings.shuffleA;
  saveState();
  updateSidebarUI();
  startSession(); 
};

document.getElementById('btnReshuffle').onclick = () => {
  state.settings.frozenOrder = null;
  saveState();
  startSession();
  closeSidebar();
};

document.getElementById('btnOnlyFav').onclick = async () => {
  const favs = Object.keys(state.favorites).map(Number);
  if (!favs.length) {
    await uiAlert({
      title: 'Избранных нет',
      text: 'Добавьте вопросы в избранное, нажимая на ⭐ в карточке вопроса.',
      icon: 'info',
      okText: 'Понятно',
    });
    return;
  }
  startSession(favs);
  closeSidebar();
};

document.getElementById('btnFinishSidebar').onclick = async () => {
  const ok = await uiConfirm({
    title: 'Завершить тест досрочно?',
    text: 'Неотвеченные вопросы будут засчитаны как неверные.',
    icon: 'danger',
    okText: 'Завершить',
    cancelText: 'Отмена',
    danger: true,
  });
  if (ok) {
    closeSidebar();
    if (state.session) renderResult();
  }
};

document.getElementById('btnClearFav').onclick = async () => {
  const ok = await uiConfirm({
    title: 'Очистить избранное?',
    text: 'Все отмеченные вопросы будут удалены из избранного.',
    icon: 'warn',
    okText: 'Очистить',
    cancelText: 'Отмена',
  });
  if (ok) {
    state.favorites = {};
    saveState(); updateStats(); closeSidebar();
  }
};

/* ---------- INIT ---------- */
updateStats();

(async function initApp(){
  if (state.session && state.session.order && state.session.order.length) {
    const answeredCount = Object.keys(state.session.answers || {}).length;
    if (answeredCount > 0) {
      const ok = await uiConfirm({
        title: 'Продолжить тест?',
        text: `Найден незавершённый тест: вопрос ${state.session.pos + 1} из ${state.session.order.length}, отвечено ${answeredCount}.`,
        icon: 'question',
        okText: 'Продолжить',
        cancelText: 'Начать заново',
      });
      if (ok) {
        document.getElementById('timerText').textContent = fmtTime(timeRemaining);
        startTimer();
        renderAllQuestions();
        updateStats();
      } else {
        state.session = null;
        saveState();
        startSession();
      }
    } else {
      document.getElementById('timerText').textContent = fmtTime(timeRemaining);
      startTimer();
      renderAllQuestions();
      updateStats();
    }
  } else {
    startSession();
  }
})();
</script>
