<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест по иммунологии</title>
<style>
  :root{
    --bg:#0a0a0a; --panel:#141414; --panel2:#1f1f1f; --border:#2a2a2a;
    --text:#e8e8e8; --muted:#888; --accent:#4a9eff; --good:#2ecc71; --bad:#e74c3c; --star:#f1c40f;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh}

  aside{
    width:280px;flex-shrink:0;background:var(--panel);padding:16px;display:flex;flex-direction:column;gap:14px;
    position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--border)
  }
  aside h2{margin:0;font-size:16px;color:var(--accent)}
  .stat{background:var(--panel2);padding:10px;border-radius:8px;font-size:13px;line-height:1.7;border:1px solid var(--border)}
  .stat b{color:var(--accent)}
  .fav-list{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto}
  .fav-item{background:var(--panel2);padding:8px;border-radius:6px;font-size:12px;display:flex;justify-content:space-between;gap:6px;cursor:pointer;border:1px solid var(--border)}
  .fav-item:hover{border-color:var(--accent)}
  .fav-item button{background:none;border:none;color:var(--bad);cursor:pointer;font-size:14px}
  .btns{display:flex;flex-direction:column;gap:8px}
  button.act{background:var(--accent);color:#000;border:none;padding:10px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px}
  button.act:hover{filter:brightness(1.1)}
  button.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
  button.ghost:hover{background:#2a2a2a}
  button:disabled{opacity:.4;cursor:not-allowed}
  .copyright{font-size:12px;color:var(--muted);margin-top:auto;text-align:center;padding-top:10px;border-top:1px solid var(--border)}

  main{flex:1;padding:24px;max-width:860px;margin:0 auto;display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px;flex-wrap:wrap}
  header h1{font-size:20px;margin:0;color:var(--accent)}
  .progress-text{font-size:14px;color:var(--muted)}
  .timer{font-size:16px;font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600}
  .timer.warn{color:var(--bad)}

  .card{background:var(--panel);border-radius:12px;padding:22px;border:1px solid var(--border)}
  .q-num{font-size:12px;color:var(--muted);margin-bottom:8px}
  .q-text{font-size:18px;margin-bottom:18px;line-height:1.45}
  .opt{
    display:block;width:100%;text-align:left;background:var(--panel2);color:var(--text);border:1px solid var(--border);
    padding:13px 15px;border-radius:9px;margin-bottom:9px;cursor:pointer;font-size:15px;transition:.12s;
  }
  .opt:hover:not(.disabled){border-color:var(--accent)}
  .opt.correct{background:rgba(46,204,113,.18);border-color:var(--good);color:#b8f5d0}
  .opt.wrong{background:rgba(231,76,60,.18);border-color:var(--bad);color:#f5c0b8}
  .opt.disabled{cursor:default;opacity:.95}
  .star-btn{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;float:right;margin-left:8px;line-height:1}
  .star-btn.active{color:var(--star)}

  .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
  .actions button{flex:1;min-width:130px}
  .show-answer{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
  .show-answer:hover{background:#2a2a2a}

  .result{text-align:center;padding:20px}
  .result .grade{font-size:52px;font-weight:700;color:var(--accent);margin:10px 0}
  .result .pct{font-size:20px;color:var(--muted);margin-bottom:20px}
  .result .rows{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-bottom:24px;font-size:15px}
  .result .rows div{background:var(--panel2);padding:10px 16px;border-radius:8px;border:1px solid var(--border)}
  .result .rows b{color:var(--accent)}
  .result .row-good b{color:var(--good)}
  .result .row-bad b{color:var(--bad)}

  .footer-note{text-align:center;color:var(--muted);font-size:12px;margin-top:auto;padding-top:24px}
  .empty{color:var(--muted);font-size:12px}
  .hidden{display:none!important}

  @media(max-width:800px){body{flex-direction:column}aside{width:100%;height:auto;position:static}main{padding:14px}}
</style>
</head>
<body>

<aside>
  <h2>Иммунология</h2>

  <div class="stat" id="stats">
    Отвечено: <b id="sAns">0</b> / <span id="sTot">0</span><br>
    Верно: <b id="sGood" style="color:var(--good)">0</b><br>
    Неверно: <b id="sBad" style="color:var(--bad)">0</b><br>
    Избранное: <b id="sFav">0</b>

  <div>

    <div class="fav-list" id="favList"><div class="empty">Пока пусто</div></div>
  </div>

  <div class="btns">
    <button class="act ghost" id="restartBtn">Пройти заново</button>
    <button class="act ghost" id="errorsBtn">Повторить ошибки</button>
    <button class="act ghost" id="favBtn">Только избранное</button>
    <button class="act ghost" id="resetBtn">Сбросить прогресс</button>
  </div>

  <div class="copyright">© 2026 Murad Khibievich</div>
</aside>

<main>
  <header>
    <h1>Тест по иммунологии</h1>
    <div class="progress-text" id="progressText">0 / 0</div>
    <div class="timer" id="timer">00:00</div>
  </header>

  <div id="quizArea"></div>

  <div class="footer-note">© 2026 Murad Khibievich</div>
</main>

<script>

− эндокринная система

− искусственным

− видовым
+ активным

Фагоцитоз как фактор защиты впервые был описан:

Самыми многочисленными лейкоцитами периферической крови взрослого человека являются:
− лимфоциты

Врождённый иммунитет — это защита, которая:

Главные клетки-фагоциты:
− эритроциты

+ нейтрофилы и макрофаги

− гормоны
− антитела

+ разрушение (лизис) микробной клетки

− перенос кислорода
− синтез инсулина

− только зудом
− снижением температуры
+ покраснением, отёком, болью и повышением температуры

Лизоцим разрушает:
− вирусы

− эритроциты

Интерфероны защищают прежде всего от:
− бактерий

− гормоны поджелудочной железы

Белок острой фазы воспаления:

/* ============================================================
   ПАРСЕР
   ============================================================ */
function parse(raw){
  const blocks = raw.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
  const out = [];
  blocks.forEach(block => {
    const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
    if (!lines.length) return;
    const q = lines[0];
    const opts = [];
    let correct = -1;
    for (let i = 1; i < lines.length; i++){
      const l = lines[i];
      if (l.startsWith('+')) { correct = opts.length; opts.push(l.slice(1).trim()); }
      else if (l.startsWith('−') || l.startsWith('-')) { opts.push(l.slice(1).trim()); }
    }
    if (q && opts.length && correct >= 0) out.push({ q, opts, correct });
  });
  return out;
}

const QUESTIONS = parse(RAW);
const TOTAL = QUESTIONS.length;

/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
const LS_KEY = 'immuno_test_state_v1';
const state = {
  answers: {},      // {qIndex: {selected, correct}} — последний ответ
  favorites: {},    // {qIndex: true}
  bestScore: null,  // {pct, grade, time}
  bestTime: null
};
function loadState(){
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if (s) Object.assign(state, s);
  } catch(e){}
}
function saveState(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
}
loadState();

/* ============================================================
   SESSION (текущая попытка)
   ============================================================ */
let session = {
  order: [],       // индексы вопросов в порядке прохождения
  pos: 0,          // текущая позиция
  answers: {},     // {qIndex: selectedIdx | null}
  started: 0,      // timestamp
  finished: false,
  mode: 'normal'   // normal | exam | errors | fav
};
let timerInterval = null;
let elapsed = 0;          // секунд
let examDuration = 20*60; // 20 минут
let examRemaining = examDuration;

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function fmtTime(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
}
function gradeFromPct(pct){
  if (pct >= 90) return '5';
  if (pct >= 75) return '4';
  if (pct >= 60) return '3';
  return '2';
}
function gradeColor(g){
  return g === '5' ? 'var(--good)' : g === '4' ? '#7ed957' : g === '3' ? '#f1c40f' : 'var(--bad)';
}

/* ============================================================
   ОБНОВЛЕНИЕ САЙДБАРА
   ============================================================ */
function updateStats(){
  const answered = Object.keys(state.answers).length;
  let good = 0, bad = 0;
  for (const k in state.answers){
    if (state.answers[k].correct) good++; else bad++;
  }
  document.getElementById('sAns').textContent = answered;
  document.getElementById('sTot').textContent = TOTAL;
  document.getElementById('sGood').textContent = good;
  document.getElementById('sBad').textContent = bad;
  document.getElementById('sFav').textContent = Object.keys(state.favorites).length;
  renderFavList();
}
function renderFavList(){
  const box = document.getElementById('favList');
  const keys = Object.keys(state.favorites).map(Number).sort((a,b)=>a-b);
  if (!keys.length){ box.innerHTML = '<div class="empty">Пока пусто</div>'; return; }
  box.innerHTML = keys.map(i => `
    <div class="fav-item" data-i="${i}">
      <span>${i+1}. ${escapeHtml(QUESTIONS[i].q.slice(0,45))}${QUESTIONS[i].q.length>45?'…':''}</span>
      <button data-rm="${i}" title="Убрать">×</button>
    </div>`).join('');
  box.querySelectorAll('.fav-item').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target.dataset.rm !== undefined){
        delete state.favorites[e.target.dataset.rm];
        saveState(); updateStats();
        return;
      }
      // переход к вопросу из избранного (просмотр вне сессии)
      const i = Number(el.dataset.i);
      viewSingleQuestion(i);
    });
  });
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============================================================
   ТАЙМЕР
   ============================================================ */
function startTimer(mode){
  stopTimer();
  elapsed = 0;
  examRemaining = examDuration;
  updateTimerDisplay(mode);
  timerInterval = setInterval(() => {
    elapsed++;
    if (mode === 'exam'){
      examRemaining--;
      if (examRemaining <= 0){
        examRemaining = 0;
        updateTimerDisplay(mode);
        stopTimer();
        finishSession(true);
        return;
      }
    }
    updateTimerDisplay(mode);
  }, 1000);
}
function stopTimer(){
  if (timerInterval){ clearInterval(timerInterval); timerInterval = null; }
}
function updateTimerDisplay(mode){
  const el = document.getElementById('timer');
  if (mode === 'exam'){
    el.textContent = '⏱ ' + fmtTime(examRemaining);
    el.classList.toggle('warn', examRemaining <= 60);
  } else {
    el.textContent = '⏱ ' + fmtTime(elapsed);
    el.classList.remove('warn');
  }
}

/* ============================================================
   ЗАПУСК СЕССИИ
   ============================================================ */
function startSession(mode, indexes){
  if (!indexes || !indexes.length){
    alert('Нет вопросов для этого режима.');
    return;
  }
  session = {
    order: shuffle(indexes),
    pos: 0,
    answers: {},
    started: Date.now(),
    finished: false,
    mode
  };
  startTimer(mode);
  renderQuestion();
}
function startAll(){
  startSession('normal', QUESTIONS.map((_,i)=>i));
}
function startExam(){
  startSession('exam', QUESTIONS.map((_,i)=>i));
}
function startErrors(){
  const idx = Object.keys(state.answers)
    .map(Number)
    .filter(i => state.answers[i] && !state.answers[i].correct);
  if (!idx.length){ alert('Ошибок нет. Сначала пройди тест.'); return; }
  startSession('normal', idx);
}
function startFav(){
  const idx = Object.keys(state.favorites).map(Number);
  if (!idx.length){ alert('Избранное пусто.'); return; }
  startSession('normal', idx);
}

/* ============================================================
   РЕНДЕР ВОПРОСА
   ============================================================ */
function renderQuestion(){
  if (session.pos >= session.order.length){ finishSession(); return; }
  const qIndex = session.order[session.pos];
  const q = QUESTIONS[qIndex];
  const answered = session.answers[qIndex] !== undefined;
  const selected = session.answers[qIndex];
  const isExam = session.mode === 'exam';
  const showFeedback = answered && !isExam;

  const area = document.getElementById('quizArea');
  area.innerHTML = `
    <div class="card">
      <div class="q-num">Вопрос ${session.pos + 1} из ${session.order.length}</div>
      <div class="q-text">
        <button class="star-btn ${state.favorites[qIndex]?'active':''}" id="starBtn" title="В избранное">★</button>
        ${escapeHtml(q.q)}
      </div>
      <div id="opts">
        ${q.opts.map((o,i) => {
          let cls = 'opt';
          if (showFeedback){
            cls += ' disabled';
            if (i === q.correct) cls += ' correct';
            else if (i === selected) cls += ' wrong';
          }
          return `<button class="${cls}" data-i="${i}" ${showFeedback?'disabled':''}>${escapeHtml(o)}</button>`;
        }).join('')}
      </div>
      <div class="actions">
        ${!answered && !isExam ? `<button class="show-answer" id="showAnswerBtn">Показать правильный ответ</button>` : ''}
        <button class="act" id="nextBtn" ${(!answered && !isExam) ? 'disabled' : ''}>${session.pos + 1 === session.order.length ? 'Завершить' : 'Дальше →'}</button>
      </div>
    </div>
  `;

  document.getElementById('starBtn').addEventListener('click', () => {
    if (state.favorites[qIndex]) delete state.favorites[qIndex];
    else state.favorites[qIndex] = true;
    saveState(); updateStats(); renderQuestion();
  });

  area.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => {
      if (answered) return;
      const i = Number(btn.dataset.i);
      session.answers[qIndex] = i;
      // сохраняем в постоянное состояние
      state.answers[qIndex] = { selected: i, correct: i === q.correct };
      saveState(); updateStats();
      renderQuestion();
    });
  });

  const showBtn = document.getElementById('showAnswerBtn');
  if (showBtn){
    showBtn.addEventListener('click', () => {
      session.answers[qIndex] = null; // не выбран, но помечен как "показан"
      // не сохраняем как ошибку — просто показываем
      // отображаем правильный ответ вручную
      const opts = area.querySelectorAll('.opt');
      opts.forEach((b,i) => {
        b.disabled = true; b.classList.add('disabled');
        if (i === q.correct) b.classList.add('correct');
      });
      showBtn.remove();
      document.getElementById('nextBtn').disabled = false;
      // фиксируем как неверный (пользователь не ответил)
      state.answers[qIndex] = { selected: -1, correct: false };
      saveState(); updateStats();
    });
  }

  document.getElementById('nextBtn').addEventListener('click', () => {
    session.pos++;
    renderQuestion();
  });

  updateProgress();
}

function updateProgress(){
  document.getElementById('progressText').textContent =
    `${session.pos + 1} / ${session.order.length}`;
}

/* ============================================================
   ЗАВЕРШЕНИЕ СЕССИИ
   ============================================================ */
function finishSession(timeUp){
  stopTimer();
  session.finished = true;
  let good = 0, bad = 0, unanswered = 0;
  session.order.forEach(qi => {
    const a = session.answers[qi];
    if (a === undefined || a === null) unanswered++;
    else if (a === QUESTIONS[qi].correct) good++;
    else bad++;
  });
  const answeredCount = good + bad;
  const pct = answeredCount ? Math.round(good / session.order.length * 100) : 0;
  const grade = gradeFromPct(pct);
  const timeStr = fmtTime(elapsed);

  // Лучший результат
  if (state.bestScore === null || pct > state.bestScore.pct ||
      (pct === state.bestScore.pct && elapsed < state.bestScore.seconds)){
    state.bestScore = { pct, grade, seconds: elapsed, timeStr };
    saveState();
  }

  document.getElementById('timer').textContent = '⏱ ' + timeStr;

  const area = document.getElementById('quizArea');
  area.innerHTML = `
    <div class="card result">
      <div style="font-size:15px;color:var(--muted)">${timeUp?'Время вышло!':'Тест завершён'}</div>
      <div class="grade" style="color:${gradeColor(grade)}">${grade}</div>
      <div class="pct">${pct}% правильных</div>
      <div class="rows">
        <div class="row-good">Верно: <b>${good}</b></div>
        <div class="row-bad">Неверно: <b>${bad}</b></div>
        <div>Без ответа: <b>${unanswered}</b></div>
        <div>Время: <b>${timeStr}</b></div>
      </div>
      ${state.bestScore ? `<div style="font-size:13px;color:var(--muted);margin-bottom:18px">Лучший результат: ${state.bestScore.pct}% (оценка ${state.bestScore.grade}, ${state.bestScore.timeStr})</div>` : ''}
      <div class="actions" style="justify-content:center">
        ${bad > 0 ? `<button class="act" id="resErrorsBtn">Разобрать ошибки</button>` : ''}
        <button class="act ghost" id="resRestartBtn">Пройти заново</button>
        ${Object.keys(state.favorites).length ? `<button class="act ghost" id="resFavBtn">Только избранное</button>` : ''}
      </div>
    </div>
  `;
  document.getElementById('progressText').textContent = `${session.order.length} / ${session.order.length}`;

  const eb = document.getElementById('resErrorsBtn');
  if (eb) eb.addEventListener('click', startErrors);
  document.getElementById('resRestartBtn').addEventListener('click', startAll);
  const fb = document.getElementById('resFavBtn');
  if (fb) fb.addEventListener('click', startFav);

  updateStats();
}

/* ============================================================
   ПРОСМОТР ОДИНОЧНОГО ВОПРОСА (из избранного)
   ============================================================ */
function viewSingleQuestion(qIndex){
  stopTimer();
  const q = QUESTIONS[qIndex];
  const area = document.getElementById('quizArea');
  area.innerHTML = `
    <div class="card">
      <div class="q-num">Вопрос ${qIndex + 1}</div>
      <div class="q-text">
        <button class="star-btn active" id="starBtn" title="Убрать из избранного">★</button>
        ${escapeHtml(q.q)}
      </div>
      <div>
        ${q.opts.map((o,i) => {
          const cls = 'opt disabled' + (i === q.correct ? ' correct' : '');
          return `<button class="${cls}" disabled>${escapeHtml(o)}</button>`;
        }).join('')}
      </div>
      <div class="actions">
        <button class="act" id="backBtn">← К тесту</button>
      </div>
    </div>
  `;
  document.getElementById('starBtn').addEventListener('click', () => {
    delete state.favorites[qIndex];
    saveState(); updateStats();
    renderFavList();
  });
  document.getElementById('backBtn').addEventListener('click', () => {
    if (!session.finished && session.order.length){
      renderQuestion();
      if (session.mode === 'exam') startTimer('exam'); else startTimer('normal');
    } else {
      startAll();
    }
  });
}

/* ============================================================
   КНОПКИ САЙДБАРА
   ============================================================ */
document.getElementById('restartBtn').addEventListener('click', startAll);
document.getElementById('errorsBtn').addEventListener('click', startErrors);
document.getElementById('favBtn').addEventListener('click', startFav);
document.getElementById('resetBtn').addEventListener('click', () => {
  if (!confirm('Сбросить весь прогресс, избранное и лучший результат?')) return;
  state.answers = {};
  state.favorites = {};
  state.bestScore = null;
  saveState();
  updateStats();
  stopTimer();
  startAll();
});

/* ============================================================
   СТАРТ
   ============================================================ */
updateStats();
startAll();
</script>
</body>
</html>
